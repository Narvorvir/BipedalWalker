<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard IA Monopoly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-4">Dashboard</h2>

    <div class="row gx-4"> 
        
        <div class="col-md-6">
            <div class="card shadow h-100"> 
                <div class="card-header bg-primary text-white text-center">
                    <h5 class="mb-0">Monitoring IA</h5>
                </div>
                <div class="card-body text-center d-flex flex-column justify-content-center">
                    <p class="text-muted mb-1">Budget du Joueur :</p>
                    <h1 class="display-4 fw-bold" id="money-display">1500</h1>
                    <div><span class="badge bg-success" id="status-badge">Connecté</span></div>
                </div>
                <div class="card-footer text-muted small">Dernière mise à jour : <span id="time">--</span></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow h-100">
                <div class="card-header bg-primary text-white text-center">
                    <h5 class="mb-0">Graphique du solde actuel</h5>
                </div>
                <div class="card-body">
                    <div style="height: 250px;"><canvas id="myChart"></canvas></div>
                </div>
            </div>
        </div>

        <div class="col-md-12">
           

            <div class="card shadow">
                <div class="card-body d-flex align-items-center justify-content-center">
                    <button class="btn btn-primary me-2">Lancer l'IA</button>
                    <button class="btn btn-outline-danger">Stop</button>
                </div>    
            </div>
            <div class="card shadow h-200">
                <div class="card-body">
                    <canvas id="myChart2"></canvas>
                </div>
            </div>

        </div>

    </div> </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    var socket = io();
    const ctx = document.getElementById('myChart').getContext('2d');
    const ctx2 = document.getElementById('myChart2').getContext('2d');

    // 1. Initialisation du graphique vide
    const myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [], // Les étiquettes de temps (X)
            datasets: [{
                label: 'Budget IA (€)',
                data: [], // Les valeurs (Y)
                borderColor: 'rgb(13, 110, 253)',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                fill: true,
                tension: 0.3 // Pour l'effet de courbe lisse
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: false }
            }
        }
    });

    const myChart2 = new Chart(ctx2, {
        type: 'bar', // On change 'line' par 'bar'
        data: {
            labels: ['IA 1', 'IA 2', 'Humain'],
            datasets: [{
                label: 'Nombre de maisons',
                data: [12, 19, 3],
                backgroundColor: ['blue', 'red', 'green']
            }]
        }
    });

    // 2. Écoute du serveur
    socket.on('update_data', function(msg) {
        const now = new Date().toLocaleTimeString();
        
        // Mise à jour du texte
        document.getElementById('money-display').innerText = msg.money;

        // Mise à jour du graphique
        myChart.data.labels.push(now);
        myChart.data.datasets[0].data.push(msg.money);

        // On garde seulement les 10 derniers points pour la lisibilité
        if (myChart.data.labels.length > 100) {
            myChart.data.labels.shift();
            myChart.data.datasets[0].data.shift();
        }

        myChart.update(); // Très important pour rafraîchir le dessin
        myChart2.update(); // Très important pour rafraîchir le dessin
    });


</script>

</body>
</html>
